<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141210">
  <meta name="description" content="CV animé de Root, développeur full-stack et sysadmin.">
  <title>Root — CV animé</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="page-heading">
      <span class="eyebrow">PORTFOLIO ANIMÉ</span>
      <h1>Root <span>— développeur full-stack &amp; sysadmin</span></h1>
    </header>

    <section class="studio" aria-label="Lecteur du CV animé">
      <div class="stage">
        <canvas id="cv" width="1920" height="1080" aria-label="CV animé de Root"></canvas>
      </div>
      <div class="control-panel">
        <div class="transport" aria-label="Commandes de lecture">
          <button id="play" class="button button-primary" type="button">Lecture</button>
          <button id="pause" class="button" type="button">Pause</button>
          <button id="restart" class="button" type="button">Recommencer</button>
        </div>
        <div class="timeline-row">
          <span id="clock" class="clock">00:00 / 01:00</span>
          <input id="seek" class="seek" type="range" min="0" max="60" step="0.1" value="0" aria-label="Position dans l’animation">
        </div>
        <div class="export-options">
          <label class="select-label" for="format">Format d’écran
            <select id="format">
              <option value="desktop">Bureau — 16:9</option>
              <option value="laptop">Portable — 16:9</option>
              <option value="tablet">Tablette — 4:3</option>
              <option value="phone">Mobile / Shorts — 9:16</option>
              <option value="foldable">Pliable — 4:5</option>
            </select>
          </label>
          <label class="select-label" for="resolution">Résolution vidéo
            <select id="resolution">
              <option value="source">Qualité source</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
            </select>
          </label>
          <button id="export" class="button button-export" type="button">Exporter en WebM</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Choisissez un format, puis lancez la lecture ou exportez votre vidéo.</p>
      </div>
    </section>
    <footer>Animation 60 secondes · Canvas 2D · Export WebM · Pour les étapes de lancement, voir <a href="README.md">README.md</a></footer>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
